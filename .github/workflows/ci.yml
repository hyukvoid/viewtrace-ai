name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: Ubuntu, os: ubuntu-latest, arch: x64 }
          - { name: Windows, os: windows-latest, arch: x64 }
          - { name: macOS ARM64, os: macos-15, arch: arm64 }
          - { name: macOS Intel, os: macos-15-intel, arch: x64 }
        # engines floor (22.13 = first unflagged node:sqlite) and current LTS
        node: ['22.13.0', '22', '24']
    name: ${{ matrix.target.name }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify actual runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.target.arch }}
        run: node -e "if(process.arch!==process.env.EXPECTED_ARCH)process.exit(1); console.log(process.platform,process.arch,process.version)"
      - run: npm ci
      - name: Install browser for mandatory DOM verification
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Clean offline tarball CLI / localhost browser / real console release gate
        run: npm run verify:release
